<!-- OpenFlow CDN/R2 deploy canary.
     Not referenced by any page; it exists so a deploy can prove the full chain:
     assets/ -> NAS -> R2 -> Cloudflare purge. Fetch /assets/cdn-canary.svg to check.
     Deploy credentials live in the macOS Keychain (service: openflow-deploy), so a bare
     `bash deploy/sync.sh` works on this machine without a .env file. -->
