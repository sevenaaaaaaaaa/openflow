# ============================================
# OpenFlow 宝塔 Nginx 伪静态规则（站点配置 → 伪静态 → 粘贴）
# 修复：后台 /xmp/ 路由补 .php（此前缺失导致后台 404/403）
# 对齐 .htaccess 全部前台美化 URL
# ============================================

# ─── 后台管理：美化 URL ───
location = /login             { rewrite ^ /admin/login.php last; }
location = /xmp               { rewrite ^ /admin/index.php last; }
location ^~ /xmp/ {
    # 单段页面名补 .php（关键修复：/xmp/xxx → admin/xxx.php）
    rewrite ^/xmp/([a-z0-9-]+)/?$ /admin/$1.php last;
    # 多段路径兜底
    rewrite ^/xmp/(.+)$ /admin/$1 last;
}

# ─── 前台：美化 URL ───
location = /                    { rewrite ^ /index.php last; }
location = /docs                { rewrite ^ /docs.php last; }
location = /academy             { rewrite ^ /academy.php last; }
location = /community           { rewrite ^ /community.php last; }
location = /tools               { rewrite ^ /tools.php last; }
location = /marketplace         { rewrite ^ /marketplace.php last; }
location = /courses             { rewrite ^ /courses.php last; }
location = /about               { rewrite ^ /about.php last; }
location = /product             { rewrite ^ /product.php last; }
location = /capability          { rewrite ^ /capability.php last; }
location = /downloads           { rewrite ^ /downloads.php last; }
location = /podcasts            { rewrite ^ /podcasts.php last; }
location = /survey              { rewrite ^ /survey.php last; }
location = /reviews             { rewrite ^ /reviews.php last; }
location = /topics              { rewrite ^ /topics.php last; }
location = /navigation          { rewrite ^ /navigation.php last; }
location ^~ /navigation-site    { rewrite ^/navigation-site.php last; }
location ^~ /article/           { rewrite ^/article/(.*)$ /article.php?slug=$1 last; }
location ^~ /author/            { rewrite ^/author/(.*)$ /author.php?name=$1 last; }
location ^~ /topic/             { rewrite ^/topic/(.*)$ /topics.php?slug=$1 last; }
location ^~ /event/             { rewrite ^/event/(.*)$ /event.php?slug=$1 last; }
location = /events              { rewrite ^ /events.php last; }
location ^~ /course/            { rewrite ^/course/(.*)$ /course-player.php?slug=$1 last; }
location ^~ /lp/                { rewrite ^/lp/(.*)$ /landing.php?slug=$1 last; }
location ^~ /skill/             { rewrite ^/skill/(.*)$ /asset.php?type=skill&id=$1 last; }
location ^~ /plugin/            { rewrite ^/plugin/(.*)$ /asset.php?type=plugin&id=$1 last; }
location ^~ /theme/             { rewrite ^/theme/(.*)$ /asset.php?type=theme&id=$1 last; }
location = /search              { rewrite ^ /search.php last; }
location = /thank-you           { rewrite ^ /thank-you.php last; }
location = /activate            { rewrite ^ /activate.php last; }
location = /shop                { rewrite ^ /shop.php last; }

# ─── API ───
location ^~ /api/ {
    rewrite ^/api/([^?]*)$ /api/$1 last;
}
